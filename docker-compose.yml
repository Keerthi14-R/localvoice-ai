version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    environment:
      - APP_NAME=LocalVoice AI
      - HOST=0.0.0.0
      - PORT=8000
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - WHISPER_CPU_THREADS=2
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
